<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">  
</head>
<body>
  
  <div id="loading-overlay" class="loading-overlay oculto">
    <div class="spinner"></div>
    <p>Carregando...</p>
  </div>

  <h1 class="titulo">Lista de Tarefas</h1>

  <section id="auth-section">
    <div id="login-container">
      <h2>Entrar</h2>
      <input type="email" id="login-email" placeholder="Email">
      <input type="password" id="login-password" placeholder="Senha">
      <button onclick="fazerLogin()">Entrar</button>
      <p>Não tem conta? <a href="#" onclick="alternarAuth(true)">Cadastre-se</a></p>
    </div>

    <div id="registro-container" class="oculto">
      <h2>Criar Conta</h2>
      <input type="text" id="reg-first-name" placeholder="Primeiro Nome">
      <input type="text" id="reg-last-name" placeholder="Sobrenome">
      <input type="email" id="reg-email" placeholder="Email">
      <input type="password" id="reg-password" placeholder="Senha">
      <button onclick="registrar()">Criar Conta</button>
      <p>Já tem conta? <a href="#" onclick="alternarAuth(false)">Fazer Login</a></p>
    </div>
  </section>

  <section id="app-section" class="oculto">
    <div class="header-app">
      <span id="boas-vindas"></span>
      <button onclick="logout()">Sair</button>
    </div>
    
    <div class="input-container">
      <input type="text" id="novaTarefa" placeholder="Adicionar nova tarefa">
      <button onclick="adicionarTarefa()">Adicionar</button>
    </div>

    <div class="main-layout">

    </div>
  </section>

  <script type="module" src="main.js"></script>
</body>
</html>
