<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">  
</head>
<body>
 <h1 class="titulo">Lista de Tarefas</h1>
  <div class="input-container">
    <input type="text" id="nova-tarefa" class="nova-tarefa" placeholder="Adicionar nova tarefa">
    <button onclick="adicionarTarefa()" id="botao-tarefa" class="botao-tarefa">Adicionar</button>
  </div> 
 
  <div class="container">
    <ul class="lista" id="lista"></ul>
   </div> 
  
  <div id="modal-edicao" class="modal-container oculto">
    <div class="modal-content">
      <h3 class="modal-titulo">Editar Tarefa</h3>
      <input type="text" id="editar-tarefa" placeholder="Digite uma nova tarefa">
      <div class="modal-botoes">
        <button onclick="fecharModal()" class="botao-cancelar">Cancelar</button>
        <button onclick="salvarEdicao()" class="botao-salvar">Salvar</button>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
