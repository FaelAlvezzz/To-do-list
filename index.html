<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">  
</head>
<body>
 <h1 class="titulo">Lista de Tarefas</h1>
  <div class="input-container">
    <input type="text" id="novaTarefa" class="nova-tarefa" placeholder="Adicionar nova tarefa">
    <button onclick="adicionarTarefa()" id="botao-tarefa" class="botao-tarefa">Adicionar</button>
  </div> 
 
  <div class="main-layout">
    <div class="coluna-tarefas">
      <h2>Pendentes</h2>
      <div class="container">
        <ul class="lista-pendentes" id="lista-tarefas"></ul>
      </div>
    </div>
   </div>

   <div class="coluna-tarefas">
    <div class="header-concluidas">
      <h2>Concluídas</h2>
      <button onclick="apagarTudoConcluidas()" id="btn-limpar">Apagar Tudo</button>
    </div>
    <div class="container container-concluidas">
      <ul id="lista-concluidos" class="lista-tarefa"></ul>
    </div>
   </div>
  
  <div id="modal-edicao" class="modal-container oculto">
    <div class="modal-content">
      <h3 class="modal-titulo">Editar Tarefa</h3>
      <input type="text" id="editarTarefa" placeholder="Digite uma nova tarefa">
      <div class="modal-botoes">
        <button onclick="fecharModal()" class="botao-cancelar">Cancelar</button>
        <button onclick="salvarEdicao()" class="botao-salvar">Salvar</button>
      </div>
    </div>
  </div>

  <div id="registro-container">
    <input type="text" id="reg-email" placeholder="Email">
    <input type="password" id="reg-password" placeholder="Senha">
    <input type="text" id="reg-first-name" placeholder="Primeiro Nome">
    <input type="text" id="reg-last-name" placeholder="Último Nome">
    <button type="button" onclick="registrar()">Criar Conta</button>
  </div>

  <div id="login-container">
    <h2>Login de Usuário</h2>
    <div class="input-group">
        <label for="login-email">Email:</label>
        <input type="text" id="login-username" placeholder="Digite seu nome de usuário">
    </div>
    
    <div class="input-group">
        <label for="login-password">Senha:</label>
        <input type="password" id="login-password" placeholder="Digite sua senha">
    </div>

    <button type="button" onclick="fazerLogin()">Entrar</button>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
